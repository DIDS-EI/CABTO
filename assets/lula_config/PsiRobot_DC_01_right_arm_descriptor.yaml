# The robot descriptor defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF, except when otherwise specified below under
# cspace_urdf_bridge
cspace:
  - arm2_joint_link1
  - arm2_joint_link2
  - arm2_joint_link3
  - arm2_joint_link4
  - arm2_joint_link5
  - arm2_joint_link6
  # - arm_left_7_joint


root_link: base_link
subtree_root_link: base_link

default_q: [
    0.0, -0.0, -0.0, 0.0019, -0.0002, 0.0165 #,0.0147
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted.
# cspace_to_urdf_rules:
#     - {name: arm1_joint_link1, rule: fixed, value: -0.0}
#     - {name: arm1_joint_link2, rule: fixed, value: 0.0}
#     - {name: arm1_joint_link3, rule: fixed, value: 0.}
#     - {name: arm1_joint_link4, rule: fixed, value: 0.0007}
#     - {name: arm1_joint_link5, rule: fixed, value: -0.0002}
#     - {name: arm1_joint_link6, rule: fixed, value: 1.0703}
#     - {name: arm1_joint_link7, rule: fixed, value: 1.0703}
composite_task_spaces: []

